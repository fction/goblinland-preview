<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Order your cards · Goblin Cards preview</title>
<link rel="stylesheet" href="brand.css">
<style>
* {box-sizing:border-box}
html {color-scheme:dark}
body {margin:0;min-height:100svh;display:grid;place-items:center;background:#141415;color:#fafafa}
.phone {position:relative;container-type:inline-size;width:min(96vw,410px,46svh);aspect-ratio:1440/2988}
.phone::after {content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:url("assets/hero/order-iphone-17-pro-max-silver.webp") center/contain no-repeat}
.screen {--sf-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF UI Text","Segoe UI",sans-serif;--sf-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF UI Display","Segoe UI",sans-serif;position:absolute;inset:2.008032% 4.166667%;border-radius:12.916667cqw;background:radial-gradient(ellipse 84% 38% at 5% 0%,rgb(255 255 255 / .085) 0%,rgb(255 255 255 / .055) 33%,rgb(255 255 255 / .016) 72%,transparent 100%),#242425;color:var(--paper);overflow:hidden;display:flex;flex-direction:column;font:400 3.65cqw/1.45 var(--sf-text)}
.screen::before {content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:
  linear-gradient(90deg,rgb(0 0 0 / var(--shade-side,.5)),transparent 49%,transparent 51%,rgb(0 0 0 / var(--shade-side,.5))),
  linear-gradient(180deg,rgb(0 0 0 / var(--shade-top,.8)),rgb(0 0 0 / calc(var(--shade-top,.8)*.698)) 7%,rgb(0 0 0 / calc(var(--shade-top,.8)*.337)) 16%,rgb(0 0 0 / calc(var(--shade-top,.8)*.105)) 28%,transparent 48%),
  linear-gradient(to top,rgb(0 0 0 / var(--shade-bottom,.8)),rgb(0 0 0 / calc(var(--shade-bottom,.8)*.55)) 50%,transparent) bottom / 100% var(--shade-height,100%) no-repeat}
html[data-card-embed], html[data-card-embed] body {background:transparent;overflow:hidden}
html[data-card-embed] {color-scheme:normal}
html[data-card-embed] .screen {color-scheme:dark}
html[data-card-embed] .phone {width:100vw}
.screen > * {position:relative}
.status,nav {position:relative;z-index:1}
.status {display:block;width:100%;height:auto;flex:none}
nav {display:flex;align-items:center;justify-content:space-between;height:12cqw;padding:0 5.5cqw}
.order-heading {margin:0;font:500 5.5cqw/1.15 var(--sf-display);letter-spacing:-.025em}
.progress {display:flex;gap:1cqw}
.progress i {width:3.7cqw;height:.7cqw;background:#39393c;border-radius:2cqw}
.progress .done {background:var(--brand-accent)}
html[data-card-embed] .progress .done {visibility:hidden}
main {display:flex;flex-direction:column;flex:1;min-height:0;padding:3.5cqw 5.5cqw 0}
#order,section:not([hidden]) {display:flex;flex:1;min-height:0;flex-direction:column}
#order section:first-child fieldset {margin-top:0;margin-bottom:1.2cqw}
main:has(#order section:first-child:not([hidden])) {padding-top:7cqw}
#title {font:650 9cqw/.99 var(--sf-display);letter-spacing:-.05em;margin:0 0 5cqw}
h2,legend {font:500 4cqw/1.3 var(--sf-text);margin:0 0 2.4cqw;padding:0}
fieldset {position:relative;border:0;margin:0;padding:0;min-width:0}
.order-stage {position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column}
.art {display:grid;place-items:center;position:relative;isolation:isolate}
.card {display:block;width:72cqw;height:auto;filter:drop-shadow(0 1.1cqw 1.5cqw rgb(0 0 0 / .48))}
.product {display:grid;text-align:center;justify-items:center;align-content:center;flex:none;margin:12.5cqw auto auto;width:100%}
.product strong {font:550 5.2cqw/1.2 var(--sf-text);letter-spacing:-.02em;color:#dedee0}
.amount {margin-top:1.5cqw;font:600 16.5cqw/1 var(--sf-display);letter-spacing:-.052em;font-variant-numeric:lining-nums}
.amount span {color:#a3a4a8;font-weight:450}
.product small {
  display:inline-flex;align-items:center;gap:1.2cqw;margin-top:2.8cqw;padding:1.6cqw 3.6cqw;border-radius:999px;
  background:
    radial-gradient(ellipse 85% 64% at 50% 0%,rgb(0 0 0 / .18),transparent),
    radial-gradient(ellipse 78% 62% at 50% 100%,rgb(255 255 255 / .032),transparent),
    rgb(255 255 255 / .022);
  color:#d5d8d6;font:500 3.65cqw/1.25 var(--sf-text)
}
.product small svg {width:4cqw;height:4cqw;fill:none;stroke:currentColor;stroke-width:1.6}
.fields,.summary {background:linear-gradient(145deg,#1e1e20,#171719);border-radius:3.8cqw;padding:0 3.6cqw;box-shadow:inset 0 0 0 1px #ffffff0b}
.choices {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:3.6cqw;overflow:hidden;background:rgb(255 255 255 / .045);box-shadow:inset 0 1px rgb(255 255 255 / .035),0 1.4cqw 3cqw -.6cqw rgb(0 0 0 / .28)}
.choice {position:relative;display:grid;align-content:center;justify-items:start;gap:1.6cqw;min-height:18cqw;padding:2.8cqw 3.3cqw;color:#ababae;font:550 3.65cqw/1.3 var(--sf-text);cursor:pointer}
.choice + .choice {border-left:1px solid rgb(255 255 255 / .055)}
.choice:has(:checked) {background:linear-gradient(to bottom,rgb(255 255 255 / .095),rgb(255 255 255 / .065));color:#efefef;font-weight:600;box-shadow:inset 0 1px rgb(255 255 255 / .06)}
.choice svg {width:5.6cqw;height:5.6cqw;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linejoin:round;stroke-linecap:round}
.choice input {position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.choice:has(:focus-visible) {outline:2px solid var(--brand-accent);outline-offset:-3px}
.row {display:flex;align-items:center;justify-content:space-between;gap:2.8cqw;min-height:13.2cqw}
.row + .row {border-top:1px solid #303032}
.fields label {display:grid;gap:.65cqw;padding:2.5cqw 0}
.fields label:focus-within span {color:#92dfaa}
.fields label:focus-within input,.fields label:focus-within select {outline:0;box-shadow:0 1px 0 #78c68d}
.pay-block {margin-top:5cqw}
.fields select {cursor:pointer}
.fields label + label {border-top:1px solid #303032}
.fields span,.row span {font-size:3.2cqw;color:#b2b2b6}
input,select,button {font:inherit}
.fields input,.fields select {background:transparent;border:0;color:#fff;width:100%;min-width:0;padding:.8cqw 0;font-size:4cqw}
.fields select option {background:#19191b}
input::placeholder {color:#838388}
:focus-visible {outline:2px solid var(--brand-accent);outline-offset:1px}
footer {padding:4cqw 5.5cqw 2cqw;flex:none}
.cost {display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff16;margin-bottom:3.5cqw;padding-top:3.5cqw;color:#bdbdc1}
.cost strong {font:600 6.5cqw/1 var(--sf-display);color:white}
#title:focus {outline:none}
.row strong {min-width:0;}
.actions {display:flex;gap:2cqw}
button {border:0;border-radius:8cqw;min-height:12cqw;cursor:pointer;color:white}

#next {flex:1;font-weight:600;color:#041306;background:var(--brand-accent)}
.home {width:30cqw;height:1cqw;background:#ececee;border-radius:3cqw;margin:3.4cqw auto 0}
.row strong {text-align:right;max-width:68%;font-size:3.55cqw;overflow-wrap:anywhere;font-weight:500}
[hidden] {display:none!important}
.screen:has(#order section:first-child:not([hidden])) nav {height:11cqw}
main:has(#order section:first-child:not([hidden])) {padding-top:2cqw}
#order section:first-child fieldset {margin:0 0 3.5cqw}
.choices {padding:.8cqw;background:#1c1d1e;box-shadow:inset 0 1px #ffffff09,0 1.4cqw 3.5cqw -.5cqw #0007;border-radius:8cqw}
.choice {display:grid;place-items:center;padding:0 3.6cqw;min-height:8.6cqw;border-radius:8cqw;font:550 3.85cqw/1.25 var(--sf-text)}
.choice + .choice {border:0}
.choice:has(:checked) {background:radial-gradient(ellipse at 45% 0%,#494a4b,transparent 80%),#353637;color:var(--paper);box-shadow:inset 0 1px #ffffff16,0 .5cqw 1.4cqw #0005}
.entry-fields.fields {padding:0 4cqw;background:#242526;border-radius:4.4cqw;box-shadow:inset 0 1px #ffffff10,0 2cqw 4cqw -.8cqw #0008}
.entry-fields.fields label {padding:3.2cqw 0;gap:.6cqw;border-bottom:0}
.entry-fields.fields label:not([hidden]) ~ label:not([hidden]) {border-top:1px solid #ffffff0e}
.entry-fields.fields span {font-size:3.45cqw;color:var(--silver)}
.entry-fields.fields input {padding:0;font-size:4.55cqw}
.referral {display:grid;grid-template-rows:auto 8cqw;gap:.65cqw;margin:4cqw 4cqw 0;position:relative;z-index:1}
.referral span {color:#bcbcbf;font-size:3.65cqw}
.referral input {width:100%;height:calc(8cqw + var(--referral-offset,4cqw));padding:0 0 .6cqw;border:0;border-bottom:1px solid #666668;border-radius:0;background:transparent;color:var(--paper);font-size:4.55cqw}
.referral input:focus-visible {outline:0;border-bottom-color:#78c68d}
.order-stage {justify-content:center;gap:3cqw;top:var(--referral-offset,4cqw)}
.card {width:50cqw}
.product {margin:0 auto}
.product strong {font-size:4.2cqw}
.amount {font-size:10cqw}
</style>
</head>
<body><div class="phone"><div class="screen">
<img class="status" src="assets/hero/order-iphone-status.png?v=silver-aligned" width="1320" height="186" alt="">
<nav aria-label="Order progress"><h1 class="order-heading" tabindex="-1">Order cards</h1><div class="progress" role="img"><i></i><i></i><i></i><i></i></div></nav>
<main><h2 id="title" tabindex="-1" hidden></h2>
<form id="order">
<section>
<fieldset aria-label="Delivery method"><div class="choices"><label class="choice">International UPS<input type="radio" name="delivery" value="International UPS" checked></label><label class="choice">EU locker<input type="radio" name="delivery" value="EU locker"></label></div></fieldset>
<div class="entry-fields fields"><label data-ups><span>Recipient</span><input name="recipient" autocomplete="name" placeholder="Full name" required></label>
<label data-ups><span>City</span><input name="city" placeholder="City name" autocomplete="address-level2" required></label>
<label data-locker><span>Country</span><input name="country" placeholder="Country name" autocomplete="country-name" required></label>
<label data-locker><span>Postal code</span><input name="postal" placeholder="ZIP or postal code" autocomplete="postal-code" required></label></div>
<label class="referral"><span>Referral code (optional)</span><input name="referral" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
<div class="order-stage"><div class="art">
 <svg class="card" viewBox="0 0 982 622" role="img" aria-label="Graphite Goblin card">
  <defs><image id="graphite-face" href="assets/hero/portrait-wallet-clean-seat-Original.png" width="622" height="982"/></defs>
  <g transform="translate(0 622) rotate(-90)">
   <use href="#graphite-face"/>
   <!-- Continue the same graphite finish through the network-mark area in this preview. -->
   <svg x="85" y="767" width="54" height="160" viewBox="85 740 54 22" preserveAspectRatio="none"><use href="#graphite-face"/></svg>
  </g>
 </svg>
</div>
<div class="product"><strong>Goblin Black MC</strong><div class="amount">$350<span>.00</span></div><small><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 12H2.8A1.8 1.8 0 0 1 1 10.2V5.8A1.8 1.8 0 0 1 2.8 4H13"/><rect x="5" y="7" width="13.5" height="9" rx="2"/></svg>Physical + virtual</small></div></div>

</section>
<section hidden><div class="fields">

<label data-ups><span>Street address</span><input name="street" autocomplete="street-address" placeholder="Street, number, apartment" required></label>

<label data-ups><span>State / province</span><input name="region" placeholder="Optional" autocomplete="address-level1"></label>
<label data-locker><span>Locker ID or address</span><input name="locker" placeholder="Locker code or street address" required></label>

</div></section>
<section hidden><div class="fields">
<label><span>Phone</span><input type="tel" name="phone" autocomplete="tel" placeholder="+1 555 0123" required></label>
<label><span>Contact</span><input name="contact" placeholder="Email, Telegram or SimpleX" required></label>
</div><div class="pay-block"><div class="fields"><label><span>Payment method</span><select name="coin" required><option value="">Select coin</option></select></label></div></div></section>
<section hidden><h2>Goblin Black MC</h2><div class="summary" id="summary"></div></section>
</form></main>
<footer><div class="cost" hidden><span>Base price</span><strong>$350</strong></div><div class="actions"><button type="submit" form="order" id="next">Continue</button></div><div class="home" aria-hidden="true"></div></footer>
</div></div>
<script>
if(new URLSearchParams(location.search).has('card-embed')){
 document.documentElement.dataset.cardEmbed='';
 document.querySelector('[name=recipient]').value='Alex Morgan';
 document.querySelector('[name=city]').value='Portland';
}
const form=document.querySelector('#order');
const steps=[...form.querySelectorAll('section')];
const title=document.querySelector('#title');
const next=document.querySelector('#next');
const progress=document.querySelector('.progress');
let step=0;
for(const coin of ['BNB','USDC (BEP20)','USDT (BEP20)','Bitcoin','Ethereum','USDC (Ethereum)','USDT (Ethereum)','Solana','USDC (Solana)','USDT (Solana)','Tron','USDT (Tron)','Monero']) form.elements.coin.add(new Option(coin));
function render(focus=true){
 const locker=form.elements.delivery.value==='EU locker';
 const titles=['',locker?'Locker details':'Shipping address','Contact & payment','Review order'];
 title.hidden=step===0;
 title.textContent=titles[step];
 form.querySelectorAll('[data-ups]').forEach(label=>label.hidden=locker);
 const destination=locker?steps[0].querySelector('.fields'):steps[1].querySelector('.fields');
 for(const name of ['country','postal']) destination.append(form.elements[name].closest('label'));
 form.querySelectorAll('[data-locker]').forEach(label=>label.hidden=!locker && !label.querySelector('[name="postal"],[name="country"]'));
 steps.forEach((section,index)=>{
   section.hidden=index!==step;
   for(const input of section.querySelectorAll('input,select')) input.disabled=section.hidden||input.closest('label').hidden;
 });
 progress.setAttribute('aria-label','Step '+(step+1)+' of '+steps.length);
 [...progress.children].forEach((item,index)=>item.classList.toggle('done',index<=step));
 document.querySelector('.cost').hidden=step===0;
 next.textContent=['Continue','Continue','Review order','Edit order'][step];
 if(step===3){
   const value=name=>form.elements[name].value.trim();
   const address=(locker?['locker','postal','country']:['recipient','street','city','region','postal','country']).map(value).filter(Boolean).join(', ');
   const summary=document.querySelector('#summary'); summary.replaceChildren();
   const details=[['Delivery',value('delivery')],['Address',address],['Phone',value('phone')],['Contact',value('contact')],['Pay with',value('coin')]];
   if(value('referral')) details.push(['Referral code',value('referral')]);
   for(const [name,text] of details){
     const row=document.createElement('div');row.className='row';
     const label=document.createElement('span');label.textContent=name;
     const output=document.createElement('strong');output.textContent=text;
     row.append(label,output);summary.append(row);
   }
 }
 if(focus) (step===0 ? document.querySelector('.order-heading') : title).focus({preventScroll:true});
}
form.addEventListener('change',e=>{if(e.target.name==='delivery')render(false)});
form.addEventListener('submit',event=>{event.preventDefault();step=(step+1)%steps.length;render()});
render(false);
</script></body></html>
